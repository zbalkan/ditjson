name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  RID: win-x64
  ARTIFACT: ditjson-win-x64

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(dotnet msbuild src/ditjson/ditjson.csproj \
            -getProperty:Version \
            -nologo | tail -n 1)"

          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Version '$version' is not a supported SemVer version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check release does not already exist
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag '$RELEASE_TAG' already exists." >&2
            echo "Update the version in Directory.Build.props before releasing." >&2
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore src/ditjson.slnx

      - name: Build
        run: dotnet build src/ditjson.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test src/ditjson.Tests/ditjson.Tests.csproj
          --no-build
          --no-restore
          --verbosity normal
          --configuration Release

      - name: Publish
        run: >
          dotnet publish src/ditjson/ditjson.csproj
          --configuration Release
          --runtime ${{ env.RID }}
          --self-contained
          --output publish/${{ env.RID }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: publish/${{ env.RID }}/ditjson.exe

  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(dotnet msbuild src/ditjson/ditjson.csproj \
            -getProperty:Version \
            -nologo | tail -n 1)"

          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Version '$version' is not a supported SemVer version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify release tag is unused
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag '$RELEASE_TAG' already exists." >&2
            echo "Update the version in Directory.Build.props before releasing." >&2
            exit 1
          fi

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT }}
          path: artifacts

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release
          cp artifacts/ditjson.exe "release/${ARTIFACT}.exe"

      - name: Create and push release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            --title "Release $RELEASE_TAG" \
            --generate-notes \
            "release/${ARTIFACT}.exe"
