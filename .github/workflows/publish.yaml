name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate source version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-p[0-9]+)?$ ]]; then
            echo "Directory.Build.props Version must match X.X.X or X.X.X-pX" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-p* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            extension: tar.gz
          - os: windows-latest
            target: win-x64
            extension: zip
          - os: macos-latest
            target: osx-x64
            extension: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish executable
        shell: bash
        run: |
          output="ditjson-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
          dotnet publish ./source/ditjson/ditjson.csproj \
            --framework net8.0 \
            --runtime "${{ matrix.target }}" \
            --configuration Release \
            --output "$output"
          rm -f "$output"/*.config "$output"/*.pdb

          if [[ "${{ matrix.target }}" == "win-x64" ]]; then
            7z a -tzip "$output.zip" "./$output/*"
          else
            tar -czf "$output.tar.gz" "$output"
          fi

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ditjson-${{ matrix.target }}
          path: ditjson-${{ needs.version.outputs.tag }}-${{ matrix.target }}.${{ matrix.extension }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: ditjson-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ditjson ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: release-assets/*
