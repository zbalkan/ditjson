name: Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/ditjson.slnx

    - name: Build
      run: dotnet build src/ditjson.slnx --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test src/ditjson.Tests/ditjson.Tests.csproj --no-build --verbosity normal --configuration Release

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/TestResults/**'
